# Builds the website from the database and publishes it to GitHub Pages.
# Runs after every collector run (Senate and House), whenever the site's files change,
# and on request.
name: Publish the website

on:
  workflow_run:
    workflows: ["insider-tracking collector", "insider-tracking House collector"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # to publish to GitHub Pages
  id-token: write   # GitHub Pages checks the deployment comes from this workflow

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # after a collector run, only rebuild when that run succeeded (otherwise the data hasn't changed)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the files from this repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Keep last week's copy of the legislators list
        uses: actions/cache@v6
        with:
          path: site/cache
          key: legislators-${{ github.run_id }}
          restore-keys: legislators-

      - name: Build the website
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}               # optional: set when the site gets its own domain
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}   # optional: "/" for a custom domain
        shell: bash
        run: python -u site/build.py --out _site 2>&1 | tee build.log

      - name: Post the build's summary as notes (readable through GitHub's API)
        if: always()
        shell: bash
        run: |
          grep -E 'reports, .* trades|filers matched|without party/state|^    .\w+\|' build.log 2>/dev/null | head -40 | while IFS= read -r line; do
            echo "::notice title=Site build::$line"
          done || true
          if grep -q Traceback build.log 2>/dev/null; then   # the build crashed: post the error as one note
            error=$(tail -n 30 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=Site build error::$error"
          fi

      - name: Prepare the upload
        uses: actions/configure-pages@v6

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
