# The House collector: saves House members' trade reports in the Supabase database.
# Runs by itself every 3 hours (half an hour after the Senate collector), and whenever you
# press "Run workflow" on the Actions tab. The run itself: see _collector.yml.
name: insider-tracking House collector

on:
  schedule:
    - cron: "53 */3 * * *"   # every 3 hours at 53 minutes past (UTC); GitHub may start it late
  workflow_dispatch:         # adds the "Run workflow" button

permissions:
  contents: read    # (the Senate collector saves the weekly heartbeat for all of them)

concurrency:
  group: house-collector    # never two House collector runs at the same time
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/_collector.yml
    with:
      collector: house
      title: House collector
      timeout-minutes: 30
      artifact: house-collector-output
    secrets:   # private settings, stored as repository secrets
      EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
