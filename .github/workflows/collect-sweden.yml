# The Swedish executives collector: saves executives' and board members' buys and sells of their
# company's shares from Finansinspektionen's register in the Supabase database. Runs by itself
# every 3 hours, and whenever you press "Run workflow". The run itself: see _collector.yml.
name: insider-tracking Sweden collector

on:
  schedule:
    - cron: "8 */3 * * *"    # every 3 hours at 8 minutes past (UTC); GitHub may start it late
  workflow_dispatch:         # adds the "Run workflow" button

permissions:
  contents: read    # (the Senate collector saves the weekly heartbeat for all of them)

concurrency:
  group: sweden-collector   # never two Sweden collector runs at the same time
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/_collector.yml
    with:
      collector: sweden
      title: Sweden collector
      timeout-minutes: 20
      artifact: sweden-collector-output
    secrets:   # private settings, stored as repository secrets
      EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
