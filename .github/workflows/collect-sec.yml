# The company-insider collector: saves officers' and directors' buys and sells (SEC Form 4)
# in the Supabase database. Runs by itself every 3 hours, and whenever you press "Run workflow".
# The run itself: see _collector.yml.
name: insider-tracking SEC collector

on:
  schedule:
    - cron: "38 */3 * * *"   # every 3 hours at 38 minutes past (UTC); GitHub may start it late
  workflow_dispatch:         # adds the "Run workflow" button

permissions:
  contents: read    # (the Senate collector saves the weekly heartbeat for all of them)

concurrency:
  group: sec-collector      # never two SEC collector runs at the same time
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/_collector.yml
    with:
      collector: sec
      title: SEC collector
      timeout-minutes: 40
      artifact: sec-collector-output
    secrets:   # private settings, stored as repository secrets
      EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
