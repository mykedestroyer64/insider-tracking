# The returns collector: works out how each traded stock did 1 month, 6 months and 1 year
# after the trade, next to the S&P 500, with Sharadar's prices (the prices are never stored).
# It needs the SHARADAR_API_KEY secret; without it a run does nothing (and doesn't fail).
# For now it only runs when you press "Run workflow"; a schedule is added once the key is in.
name: insider-tracking returns collector

on:
  workflow_dispatch:         # adds the "Run workflow" button

permissions:
  contents: read

concurrency:
  group: returns-collector   # never two returns runs at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get the files from this repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run the returns collector
        shell: bash   # bash with "pipefail": the step fails when the collector fails, even through tee
        env:   # private settings, stored as repository secrets
          SHARADAR_API_KEY: ${{ secrets.SHARADAR_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p output
          python -u collect_returns.py 2>&1 | tee output/console.log

      - name: Write the verdict to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## insider-tracking returns collector"
            echo
            if grep -q '^VERDICT' output/console.log 2>/dev/null; then
              echo "**$(grep '^VERDICT' output/console.log)**"
              echo
              echo '```'
              grep -E '^\[|^Database now|^Requests' output/console.log || true
              echo '```'
            else
              echo "**No verdict.** The collector stopped before printing one. Open the \"Run the returns collector\" step to see why."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post the verdict as a note (readable through GitHub's API)
        if: always()
        shell: bash
        run: |
          grep -E '^VERDICT|^\[|^Database now|^Requests' output/console.log 2>/dev/null | while IFS= read -r line; do
            echo "::notice title=Returns collector::$line"
          done || true
