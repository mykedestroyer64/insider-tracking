# Test run for new sources: House members' trade reports, company insiders' Form 4s,
# and Swedish executives' trades (Finansinspektionen's register).
# Start it by hand: Actions tab -> "New sources check" -> "Run workflow", and type the
# names of the checks to run (any of: house sec sweden netherlands libs).
# "libs" shows which versions of the Python libraries GitHub installs, and the newest ones on PyPI.
# "secdays" asks EDGAR (3 requests) which daily lists exist this quarter and what a missing one returns.
# "dbsize" shows how much space each table, index and column takes in the database (read only).
# "sharadar" reads Sharadar's free tickers file with the public test key, to learn its format.
# The results (examples of real filings) are saved on the "check-results" branch.
name: New sources check

on:
  workflow_dispatch:   # only runs when started by hand (no schedule)
    inputs:
      sources:
        description: "Which checks to run (space-separated: house sec sweden netherlands libs secdays dbsize sharadar)"
        default: "house sec sweden netherlands"
        required: true

permissions:
  contents: write      # to save the results on the check-results branch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the files from this repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requirements (and pdfplumber, to read PDFs)
        run: python -m pip install -r requirements.txt pdfplumber

      - name: Show the library versions (libs)
        if: contains(inputs.sources, 'libs')
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as meta
          names = ["pg8000", "scramp", "asn1crypto", "requests", "beautifulsoup4", "jinja2", "pdfplumber"]
          found = []
          for name in names:
              try:
                  found.append(f"{name} {meta.version(name)}")
              except meta.PackageNotFoundError:
                  found.append(f"{name} missing")
          print("::notice title=LIBS check::installed: " + ", ".join(found))
          import scramp
          print("::notice title=LIBS check::scramp has make_channel_binding: " + str(hasattr(scramp, "make_channel_binding"))
                + "; scramp offers: " + ", ".join(sorted(n for n in dir(scramp) if not n.startswith("_"))))
          PY
          for name in pg8000 scramp; do
            line="$(python -m pip index versions "$name" 2>/dev/null | head -2 | tr '\n' ' ' | cut -c1-400)"
            echo "::notice title=LIBS check::on PyPI: $line"
          done

      - name: Ask EDGAR which daily lists exist (secdays)
        if: contains(inputs.sources, 'secdays')
        continue-on-error: true
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
        run: |
          python - <<'PY'
          import os, re, time
          import requests
          web = requests.Session()
          web.headers["User-Agent"] = ("insider-tracking/0.1 (non-commercial public transparency project; contact: "
                                       + os.environ.get("EFD_CONTACT_EMAIL", "") + ")")
          def note(text):
              print("::notice title=SECDAYS check::" + text.replace("\n", " ")[:900])
          base = "https://www.sec.gov/Archives/edgar/daily-index/2026/QTR4/"
          r = web.get(base + "index.json", timeout=30)
          days = []
          try:
              days = sorted(i["name"] for i in r.json()["directory"]["item"] if i.get("name", "").startswith("form."))
          except Exception as error:
              note(f"listing not readable: {error}")
          note(f"listing: HTTP {r.status_code}, {len(days)} form.*.idx files: " + ", ".join(d[5:13] for d in days))
          for day in ("20261012", "20261013"):
              time.sleep(2)
              r = web.get(base + f"form.{day}.idx", timeout=30)
              text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", r.text[:600])).strip()
              note(f"form.{day}.idx: HTTP {r.status_code}, Content-Type {r.headers.get('Content-Type')}, "
                   f"{len(r.content):,} bytes, starts: {text[:200]}")
          PY

      - name: Show the database's size by table, index and column (dbsize)
        if: contains(inputs.sources, 'dbsize')
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python -u db_size_check.py

      - name: Read Sharadar's free tickers file (sharadar)
        if: contains(inputs.sources, 'sharadar')
        continue-on-error: true
        run: python -u sharadar_check.py

      - name: Check the House site
        if: contains(inputs.sources, 'house')
        continue-on-error: true   # run the other checks even if this one fails
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}   # your email, kept private
        run: |
          mkdir -p output/house
          python -u house_check.py 2>&1 | tee output/house/console.log

      - name: Check the SEC site
        if: contains(inputs.sources, 'sec')
        continue-on-error: true
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
        run: |
          mkdir -p output/sec
          python -u sec_check.py 2>&1 | tee output/sec/console.log

      - name: Check Finansinspektionen's register (Sweden)
        if: contains(inputs.sources, 'sweden')
        continue-on-error: true
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
        run: |
          mkdir -p output/sweden
          python -u sweden_check.py 2>&1 | tee output/sweden/console.log

      - name: Check the AFM's register (Netherlands)
        if: contains(inputs.sources, 'netherlands')
        continue-on-error: true
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
        run: |
          mkdir -p output/netherlands
          python -u netherlands_check.py 2>&1 | tee output/netherlands/console.log

      - name: Write the verdicts to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## New sources check"
            for part in house sec sweden netherlands; do
              [ -f "output/$part/console.log" ] || continue
              echo
              echo "### ${part^^}"
              if grep -q '^VERDICT' "output/$part/console.log" 2>/dev/null; then
                echo "**$(grep '^VERDICT' "output/$part/console.log")**"
                echo
                echo '```'
                grep '^\[' "output/$part/console.log" || true
                echo '```'
              else
                echo "**No verdict.** The script stopped before printing one."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # The same lines as annotations, so they can be read without opening the logs.
          for part in house sec sweden netherlands; do
            [ -f "output/$part/console.log" ] || continue
            grep -E '^(\[|VERDICT)' "output/$part/console.log" | while IFS= read -r line; do
              echo "::notice title=${part^^} check::$line"
            done
          done

      - name: Save the results on the check-results branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d output ] || [ -z "$(ls -A output)" ]; then echo "Nothing to save."; exit 0; fi
          cd output
          git init -q -b check-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "New sources check results (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:check-results
