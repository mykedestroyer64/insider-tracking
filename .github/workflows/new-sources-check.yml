# Test runs by hand: can a script read these sites (House members' trade reports, company
# insiders' Form 4s, Swedish and Dutch executives' trades), plus a few database and API tools.
# Each is a command of the insider_tracking package (python -m insider_tracking check house, db size, ...).
# Start it by hand: Actions tab -> "New sources check" -> "Run workflow", and type the
# names of the checks to run (any of: house sec sweden netherlands libs secdays dbsize sharadar slim).
# "libs" shows which versions of the Python libraries GitHub installs, and the newest ones on PyPI.
# "secdays" asks EDGAR (3 requests) which daily lists 2026 Q4 has, and what asking for a missing one returns.
# "dbsize" shows how much space each table, index and column takes in the database (read only).
# "sharadar" sends the returns collector's requests with Sharadar's public test key, to learn the format.
# "slim" frees the space of dropped columns and indexes (locks insider_filings for about a minute).
# The results (examples of real filings) are saved on the "check-results" branch.
name: New sources check

on:
  workflow_dispatch:   # only runs when started by hand (no schedule)
    inputs:
      sources:
        description: "Which checks to run (space-separated: house sec sweden netherlands libs secdays dbsize sharadar slim)"
        default: "house sec sweden netherlands"
        required: true

permissions:
  contents: write      # to save the results on the check-results branch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the files from this repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Show the library versions (libs)
        if: contains(format(' {0} ', inputs.sources), ' libs ')
        continue-on-error: true
        shell: bash
        run: |
          python -u -m insider_tracking check libs
          for name in pg8000 scramp; do
            line="$(python -m pip index versions "$name" 2>/dev/null | head -2 | tr '\n' ' ' | cut -c1-400 || true)"
            echo "::notice title=LIBS check::on PyPI: $line"
          done

      - name: Ask EDGAR which daily lists exist (secdays)
        if: contains(format(' {0} ', inputs.sources), ' secdays ')
        continue-on-error: true
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
        run: python -u -m insider_tracking check secdays

      - name: Show the database's size by table, index and column (dbsize)
        if: contains(format(' {0} ', inputs.sources), ' dbsize ')
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python -u -m insider_tracking db size

      - name: Free the space of dropped columns and indexes (slim)
        if: contains(format(' {0} ', inputs.sources), ' slim ')
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python -u -m insider_tracking db slim

      - name: Read Sharadar's free tickers file (sharadar)
        if: contains(format(' {0} ', inputs.sources), ' sharadar ')
        continue-on-error: true
        run: python -u -m insider_tracking check sharadar

      - name: Check the House site
        if: contains(format(' {0} ', inputs.sources), ' house ')
        continue-on-error: true   # run the other checks even if this one fails
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}   # your email, kept private
        run: |
          mkdir -p output/house
          python -u -m insider_tracking check house 2>&1 | tee output/house/console.log

      - name: Check the SEC site
        if: contains(format(' {0} ', inputs.sources), ' sec ')
        continue-on-error: true
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
        run: |
          mkdir -p output/sec
          python -u -m insider_tracking check sec 2>&1 | tee output/sec/console.log

      - name: Check Finansinspektionen's register (Sweden)
        if: contains(format(' {0} ', inputs.sources), ' sweden ')
        continue-on-error: true
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
        run: |
          mkdir -p output/sweden
          python -u -m insider_tracking check sweden 2>&1 | tee output/sweden/console.log

      - name: Check the AFM's register (Netherlands)
        if: contains(format(' {0} ', inputs.sources), ' netherlands ')
        continue-on-error: true
        shell: bash
        env:
          EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
        run: |
          mkdir -p output/netherlands
          python -u -m insider_tracking check netherlands 2>&1 | tee output/netherlands/console.log

      - name: Write the verdicts to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## New sources check"
            for part in house sec sweden netherlands; do
              [ -f "output/$part/console.log" ] || continue
              echo
              echo "### ${part^^}"
              if grep -q '^VERDICT' "output/$part/console.log" 2>/dev/null; then
                echo "**$(grep '^VERDICT' "output/$part/console.log")**"
                echo
                echo '```'
                grep '^\[' "output/$part/console.log" || true
                echo '```'
              else
                echo "**No verdict.** The script stopped before printing one."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # The same lines as annotations, so they can be read without opening the logs.
          for part in house sec sweden netherlands; do
            [ -f "output/$part/console.log" ] || continue
            grep -E '^(\[|VERDICT)' "output/$part/console.log" | while IFS= read -r line; do
              echo "::notice title=${part^^} check::$line"
            done
          done

      - name: Save the results on the check-results branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d output ] || [ -z "$(ls -A output)" ]; then echo "Nothing to save."; exit 0; fi
          cd output
          git init -q -b check-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -q -m "New sources check results (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:check-results
