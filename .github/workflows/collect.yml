# The Senate collector: saves Senate periodic transaction reports from eFD in the Supabase database.
# Runs by itself on the schedule below, and whenever you press "Run workflow" on the Actions tab.
# The run itself is the same for every collector: see _collector.yml.
name: insider-tracking collector

on:
  schedule:
    # Twice a day while eFD refuses the collector (since 23 Oct 2026). Put back "23 */3 * * *"
    # (every 3 hours) once access works again.
    - cron: "23 5,17 * * *"
  workflow_dispatch:         # adds the "Run workflow" button

permissions:
  contents: read

concurrency:
  group: collector          # never two collector runs at the same time
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write   # only used for the small weekly heartbeat file
    uses: ./.github/workflows/_collector.yml
    with:
      collector: senate
      title: Senate collector
      timeout-minutes: 30
      artifact: collector-output
      heartbeat: true
      # While eFD refuses the collector (since 23 Oct 2026), a refusal (verdict BLOCKED) is
      # recorded on the run and in the database but doesn't count as a failed run, so GitHub
      # doesn't email about it. Any other problem still fails the run and emails you.
      # Delete this line to be emailed about refusals again.
      blocked-note: "eFD refused the collector again; recorded, not counted as a failed run (no email)"
    secrets:   # private settings, stored as repository secrets
      EFD_CONTACT_EMAIL: ${{ secrets.EFD_CONTACT_EMAIL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
